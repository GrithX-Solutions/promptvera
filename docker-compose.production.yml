services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promptvera_caddy
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - promptvera_internal
      - zetopanel_shared

networks:
  promptvera_internal:
    name: promptvera_internal
  zetopanel_shared:
    external: true
